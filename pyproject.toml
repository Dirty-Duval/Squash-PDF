[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "squash"
dynamic = ["version"]
description = "Simple, user-friendly PDF compression tool for Windows"
authors = [{name = "ACWul"}]
license = {text = "AGPL-3.0"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["pdf", "compression", "ghostscript", "windows"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]

dependencies = [
    "customtkinter>=5.2.0",
    "pillow>=10.0.0",
    "tkinterdnd2>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "pyinstaller>=6.0",
]

[project.urls]
Homepage = "https://github.com/Dirty-Duval/Squash-PDF"
Repository = "https://github.com/Dirty-Duval/Squash-PDF"
Issues = "https://github.com/Dirty-Duval/Squash-PDF/issues"
Releases = "https://github.com/Dirty-Duval/Squash-PDF/releases"

[project.scripts]
squash = "squash.main:main"

[tool.setuptools.dynamic]
version = {attr = "squash.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["squash*"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# Coverage is opt-in so plain `pytest` works without pytest-cov:
#   pytest --cov=squash --cov-report=html --cov-report=term-missing
addopts = "-q"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
